<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperTracker</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: white;
      text-align: center;
    }

    header {
      padding: 40px 20px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
    }

    .search {
      margin: 30px auto;
      max-width: 500px;
      display: flex;
      gap: 10px;
      padding: 0 20px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 15px 20px;
      border: none;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .games {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin: 40px 20px;
    }

    .game {
      background: #191c25;
      padding: 25px;
      border-radius: 15px;
      width: 220px;
    }
  </style>
</head>

<body>

  <header>
    <h1>SuperTracker</h1>
    <p>Le tracker de statistiques Supercell</p>
  </header>

  <div class="search">
    <input id="tag" placeholder="Entre ton Player Tag">
    <button onclick="searchPlayer()">Rechercher</button>
  </div>

  <div class="games">
    <div class="game">
      <h2>⭐ Brawl Stars</h2>
      <p>Statistiques des joueurs</p>
    </div>

    <div class="game">
      <h2>👑 Clash Royale</h2>
      <p>Statistiques des joueurs</p>
    </div>
  </div>

  <script>
    function searchPlayer() {
      const tag = document.getElementById("tag").value;

      if (!tag) {
        alert("Entre un Player Tag !");
        return;
      }

      alert("Recherche du joueur : " + tag);
    }
  </script>

</body>
</html>
